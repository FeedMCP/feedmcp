[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feedmcp-sdk"
version = "0.1.0"
description = "Official Python SDK and CLI for FeedMCP — unified social media, creator marketing, ad library and e-commerce public data across 21 platforms (193 endpoints)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "FeedMCP", email = "support@feedmcp.com" }]
keywords = [
  "feedmcp",
  "mcp",
  "social-media-api",
  "tiktok",
  "youtube",
  "instagram",
  "twitter",
  "xiaohongshu",
  "douyin",
  "wechat",
  "ai-agent",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://feedmcp.com"
Documentation = "https://feedmcp.com/docs/"
Repository = "https://github.com/feedmcp/feedmcp"
Issues = "https://github.com/feedmcp/feedmcp/issues"

[project.scripts]
feedmcp = "feedmcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
